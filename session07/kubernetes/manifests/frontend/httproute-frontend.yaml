apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: monitoring
spec:
  parentRefs:
  - name: public-gateway
    namespace: envoy-gateway-system
  hostnames:
  - yourfullname-frontend.eks.karimarous.com
  rules:
  - backendRefs:
    - name: frontend
      port: 8080